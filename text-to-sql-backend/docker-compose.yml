services:
  queryfile:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:h2:mem:texttosql;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
      DB_USERNAME: sa
      DB_PASSWORD: ""
      API_RATE_LIMIT: 120
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
