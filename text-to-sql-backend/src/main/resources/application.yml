spring:
  application:
    name: text-to-sql-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:texttosql;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      read-only: true
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      validation-timeout: 1000
  jackson:
    default-property-inclusion: non_null
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  sql:
    max-rows: ${SQL_MAX_ROWS:100}
    query-timeout-seconds: ${SQL_QUERY_TIMEOUT_SECONDS:5}
  rate-limit:
    requests-per-minute: ${API_RATE_LIMIT:60}
